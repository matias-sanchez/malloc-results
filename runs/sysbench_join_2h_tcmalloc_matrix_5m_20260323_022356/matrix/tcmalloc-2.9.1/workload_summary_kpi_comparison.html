<head>
  <meta charset="utf-8" />

  <title>Workload Summary Kpi Comparison</title>

  <style>
    :root {
      --line: #d1d5db;
      --panel: #ffffff;
      --accent: #0f766e;
      --ink: #111827;
      --muted: #4b5563;
      --bg: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
    }
    .page {
      padding: 18px;
      display: grid;
      gap: 14px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.06);
    }
    .chart {
      padding: 8px 10px 2px;
    }
    #chart {
      min-height: 620px;
    }
    .stats-panel {
      padding: 10px;
    }
    .empty {
      color: #b91c1c;
      font-weight: 600;
      font-size: 13px;
    }
    
    .table-wrap {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 8px 10px;
      overflow: auto;
      max-height: 320px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 7px 8px;
      border-bottom: 1px solid #e5e7eb;
      text-align: right;
      white-space: nowrap;
    }
    th:first-child, td:first-child {
      text-align: left;
    }
    th {
      position: sticky;
      top: 0;
      background: #f9fafb;
      z-index: 1;
    }
    .sort-button {
      width: 100%;
      border: 0;
      background: transparent;
      padding: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
    }
    th:first-child .sort-button {
      justify-content: flex-start;
    }
    .sort-indicator::before {
      content: "↕";
      color: #94a3b8;
      font-size: 12px;
    }
    th[aria-sort="ascending"] .sort-indicator::before {
      content: "▲";
      color: var(--accent);
    }
    th[aria-sort="descending"] .sort-indicator::before {
      content: "▼";
      color: var(--accent);
    }
    
  </style>
</head>

            "aria-sort",
            active ? (sortDirection === "asc" ? "ascending" : "descending") : "none"
          );
        });
      }

      function render() {
        const orderedRows = sortedRows();
        body.innerHTML = "";
        for (const row of orderedRows) {
          const tr = document.createElement("tr");
          for (const column of columns) {
            const td = document.createElement("td");
            const value = row[column.key];
            td.textContent = column.type === "text"
              ? String(value ?? "-")
              : formatSortableNumber(value, column.type);
            tr.appendChild(td);
          }
          body.appendChild(tr);
        }
        if (empty) empty.style.display = orderedRows.length ? "none" : "block";
        updateHeaderState();
      }

      header.querySelectorAll("[data-sort-key]").forEach((cell) => {
        const button = cell.querySelector("button");
        const handleSort = () => {
          const key = cell.getAttribute("data-sort-key");
          if (!key) return;
          if (sortKey === key) {
            sortDirection = sortDirection === "asc" ? "desc" : "asc";
          } else {
            sortKey = key;
            sortDirection = defaultDirectionFor(key);
          }
          render();
        };
        if (button) {
          button.addEventListener("click", handleSort);
        } else {
          cell.addEventListener("click", handleSort);
        }
      });

      return {
        setRows(nextRows) {
          rows = Array.isArray(nextRows) ? nextRows.slice() : [];
          render();
        },
      };
    }
    
    Plotly.newPlot("chart", figure.data || [], figure.layout || {}, { responsive: true });
    const statsTable = createSortableStatsTable({
      tableId: "statsTable",
      headerId: "statsHeader",
      bodyId: "statsBody",
      emptyId: "emptyMessage",
      columns: statsColumns,
      defaultSortKey: "name",
      defaultSortDirection: "asc",
    });
    statsTable.setRows(statsRows);
  </script>
</body>
</html>
