    function formatSortableNumber(value, kind) {
      if (value === null || value === undefined || Number.isNaN(value)) return "-";
      if (kind === "integer") return Math.round(value).toLocaleString();
      const abs = Math.abs(value);
      if (abs >= 1000) return value.toLocaleString(undefined, { maximumFractionDigits: 2 });
      if (abs >= 1) return value.toFixed(2);
      return value.toFixed(6);
    }

    function createSortableStatsTable(config) {
      const header = document.getElementById(config.headerId);
      const body = document.getElementById(config.bodyId);
      const empty = config.emptyId ? document.getElementById(config.emptyId) : null;
      const columns = Array.isArray(config.columns) ? config.columns : [];
      const columnsByKey = new Map(columns.map((column) => [column.key, column]));
      let rows = [];
      let sortKey = config.defaultSortKey || (columns[0] && columns[0].key) || "name";
      let sortDirection = (config.defaultSortDirection || "asc").toLowerCase() === "desc"
        ? "desc"
        : "asc";

      function defaultDirectionFor(key) {
        const column = columnsByKey.get(key);
        if (!column) return "asc";
        return (column.default_direction || (column.type === "text" ? "asc" : "desc")).toLowerCase() === "asc"
          ? "asc"
          : "desc";
      }

      function compareValues(left, right, column) {
        if (column.type === "text") {
          const leftText = String(left ?? "").toLocaleLowerCase();
          const rightText = String(right ?? "").toLocaleLowerCase();
          if (leftText < rightText) return -1;
          if (leftText > rightText) return 1;
          return 0;
        }
        const leftNumber = Number.isFinite(left) ? left : null;
        const rightNumber = Number.isFinite(right) ? right : null;
        if (leftNumber === null && rightNumber === null) return 0;
        if (leftNumber === null) return 1;
        if (rightNumber === null) return -1;
        return leftNumber - rightNumber;
      }

      function sortedRows() {
        const column = columnsByKey.get(sortKey) || columns[0] || { key: "name", type: "text" };
        const multiplier = sortDirection === "asc" ? 1 : -1;
        return [...rows].sort((left, right) => {
          const comparison = compareValues(left[column.key], right[column.key], column);
          if (comparison !== 0) return comparison * multiplier;
          return String(left.name ?? "").localeCompare(String(right.name ?? ""));
        });
      }

      function updateHeaderState() {
        header.querySelectorAll("[data-sort-key]").forEach((cell) => {
          const active = cell.getAttribute("data-sort-key") === sortKey;
          cell.setAttribute(
            "aria-sort",
            active ? (sortDirection === "asc" ? "ascending" : "descending") : "none"
          );
        });
      }

      function render() {
        const orderedRows = sortedRows();
        body.innerHTML = "";
        for (const row of orderedRows) {
          const tr = document.createElement("tr");
          for (const column of columns) {
            const td = document.createElement("td");
            const value = row[column.key];
            td.textContent = column.type === "text"
              ? String(value ?? "-")
              : formatSortableNumber(value, column.type);
            tr.appendChild(td);
          }
          body.appendChild(tr);
        }
        if (empty) empty.style.display = orderedRows.length ? "none" : "block";
        updateHeaderState();
      }

      header.querySelectorAll("[data-sort-key]").forEach((cell) => {
        const button = cell.querySelector("button");
        const handleSort = () => {
          const key = cell.getAttribute("data-sort-key");
          if (!key) return;
          if (sortKey === key) {
            sortDirection = sortDirection === "asc" ? "desc" : "asc";
          } else {
            sortKey = key;
            sortDirection = defaultDirectionFor(key);
          }
          render();
        };
        if (button) {
          button.addEventListener("click", handleSort);
        } else {
          cell.addEventListener("click", handleSort);
        }
      });

      return {
        setRows(nextRows) {
          rows = Array.isArray(nextRows) ? nextRows.slice() : [];
          render();
        },
      };
    }
